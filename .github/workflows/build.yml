name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # One requested prerelease: ordinary branch pushes do not publish releases.
  QUALITY_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/encoder-quality' && github.event.head_commit.message == 'Release encoder-quality v1.2-encoder-quality.2' && 'v1.2-encoder-quality.2' || '' }}
  FOOBAR2000_SDK_URL: https://www.foobar2000.org/downloads/SDK-2025-03-07.7z

jobs:
  encoder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Download foobar2000 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:FOOBAR2000_SDK_URL -OutFile sdk.7z -UseBasicParsing -UserAgent 'Mozilla/5.0'
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip.install -y --no-progress
            $env:PATH = 'C:\Program Files\7-Zip;' + $env:PATH
          }
          New-Item -ItemType Directory -Force _sdk | Out-Null
          & 7z x sdk.7z "-o_sdk" -y | Out-Host
          if (Test-Path '_sdk\foobar2000\SDK') {
            Move-Item _sdk sdk
          } else {
            $inner = Get-ChildItem _sdk -Directory | Select-Object -First 1
            if (-not $inner) { throw 'SDK archive had no directory' }
            Move-Item $inner.FullName sdk
          }
          if (-not (Test-Path 'sdk\foobar2000\SDK\foobar2000_SDK.vcxproj')) {
            throw 'SDK layout unexpected — missing foobar2000_SDK.vcxproj'
          }

      - name: Build TwinVQ library, CLI and component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ toolset not found' }
          $msvc = Get-ChildItem (Join-Path $install 'VC\Tools\MSVC') | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $msvc) { throw 'No VC\Tools\MSVC version installed' }
          Write-Host "Using VCToolsVersion $($msvc.Name)"
          msbuild vqf_encoder.sln /p:Configuration=Release /p:Platform=x64 /p:VCToolsVersion=$($msvc.Name) /m /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test encoder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\bin\x64\Release\vqf_encode.exe --list-modes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-resample
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-mdct
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-codec-psychoacoustic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-codec-short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-codec-medium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-codec-adaptive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-codec-time
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-codec-ppc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-codec-ppc-time
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-codec-parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_parallel_options.py bin/x64/Release/vqf_encode.exe
          python tools/test_voice_protection.py bin/x64/Release/vqf_encode.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_tonal_protection.py bin/x64/Release/vqf_encode.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_vq_options.py bin/x64/Release/vqf_encode.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\x64\Release\vqf_encode.exe --test-roundtrip 0.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows x64 zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } elseif ($env:QUALITY_RELEASE_TAG) { $env:QUALITY_RELEASE_TAG.TrimStart('v') } else { 'dev' }
          $out = "foo_enc_vqf-$ver-win-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item bin\x64\Release\vqf_encode.exe $out\
          Copy-Item bin\x64\Release\vqf_decode.exe $out\
          Copy-Item bin\x64\Release\foo_enc_vqf.dll $out\
          Copy-Item README.md,LICENSE $out\
          $install = @(
            "TwinVQ / VQF encoder $ver (Windows x64)",
            "",
            "foo_enc_vqf.dll  - copy into foobar2000\components\ and restart",
            "vqf_encode.exe   - Converter CLI (encoder vqf_encode.exe, extension vqf, parameters -b 96 %s %d)",
            "vqf_decode.exe   - roundtrip tests",
            "",
            "Keep foo_input_vqf.dll installed to play the files you encode:",
            "https://github.com/art-ix/vqf_decoder"
          ) -join "`n"
          Set-Content -Encoding utf8 -Path "$out\INSTALL.txt" -Value $install
          Compress-Archive -Path $out\* -DestinationPath "$out.zip" -Force
          echo "ASSET=$out.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: foo_enc_vqf-win-x64
          path: foo_enc_vqf-*-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: foo_enc_vqf-*-win-x64.zip
          fail_on_unmatched_files: true
          body: |
            Initial TwinVQ / VQF encoder for foobar2000.

            Independent encoder — no FFmpeg, `tvqenc.dll`, or Yamaha SoundVQ SDK. Bitstream and codebooks match [`vqf_decoder`](https://github.com/art-ix/vqf_decoder).

            Windows x64 zip:

            | File | Purpose |
            | --- | --- |
            | `foo_enc_vqf.dll` | Native foobar2000 2.x encoder component |
            | `vqf_encode.exe` | Converter / CLI encoder |
            | `vqf_decode.exe` | CLI decoder for roundtrip tests |

            **Component:** copy `foo_enc_vqf.dll` into the foobar2000 `components` folder and restart. Bitrate is under Preferences → Advanced → TwinVQ encoder.

            **Converter:** copy `vqf_encode.exe` next to foobar2000. Encoder `vqf_encode.exe`, extension `vqf`, parameters `-b 96 %s %d` (WAV temp file).

      - name: Publish encoder-quality prerelease
        if: env.QUALITY_RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.QUALITY_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Encoder quality preview 1.2.2
          prerelease: true
          make_latest: false
          files: foo_enc_vqf-*-win-x64.zip
          fail_on_unmatched_files: true
          body: |
            Test release built from the `encoder-quality` branch.
            Stable `v1.1` remains unchanged.

            Default encoder path (no extra flags):

            - Adaptive Long/Short blocks.
            - Log-frequency spectral LSP search.
            - Bark envelope refit after the winning VQ, with keep-best (Long, Short and Medium).
            - Long-frame PPC leftover refit after main VQ, with keep-best.
            - Extra main-VQ pass when leftover PPC changes, with keep-best.
            - PPC search still on by default.

            Speed (byte-identical output): reused encoder scratch and cached per-mode tables.

            Keep-best restores the previous frame unless weighted MDCT error falls, so
            steady tones / identical / antiphase SNR did not drop on the diagnostic clips.

            Still opt-in: psychoacoustic weighting (`--psychoacoustic`) and temporal ranking.

            The Windows x64 ZIP contains `vqf_encode.exe`, `vqf_decode.exe`,
            `foo_enc_vqf.dll`, installation instructions and the license.
            Build and codec tests must pass before this package is published.

            foobar2000 Converter: encoder `vqf_encode.exe`, extension `vqf`,
            parameters `-b 96 %s %d`. Use `-b 80` for 80 kb/s.
            To disable PPC explicitly, add `--no-ppc-search`.
            Playback requires a VQF input component such as
            [vqf_decoder](https://github.com/art-ix/vqf_decoder).
