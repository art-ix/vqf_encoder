name: perf-equivalence

on:
  push:
    branches: [encoder-quality]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify encoder change
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          # Psychoacoustic tuning and protection-default changes intentionally
          # alter bitstreams. All regression tests still run.
          # Speed-only changes remain subject to strict byte equivalence and
          # alternating A/B timings against their direct parent.
          if git diff --unified=0 HEAD^ HEAD -- twinvq/include/twinvq/twinvq_encoder.hpp |
              grep -E '^[+-][[:space:]]*bool stereo_noise_protection =' > /dev/null; then
            echo "require_equivalence=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- twinvq/src/twinvq_psychoacoustic.cpp; then
            echo "require_equivalence=true" >> "$GITHUB_OUTPUT"
          else
            echo "require_equivalence=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare parent worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/vqf-parent HEAD^

      - name: Build candidate and parent
        shell: bash
        run: |
          set -euo pipefail
          make -j2 all
          make -C /tmp/vqf-parent -j2 all

      - name: Targeted SIMD regression
        shell: bash
        run: |
          set -euo pipefail
          ./bin/vqf_encode --test-simd

      - name: Byte equivalence smoke test
        if: steps.classify.outputs.require_equivalence == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_encoder_equivalence.py \
            bin/vqf_encode /tmp/vqf-parent/bin/vqf_encode

      - name: Alternating equivalence timings
        if: steps.classify.outputs.require_equivalence == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3 4; do
            echo "=== timing pass $pass ==="
            if (( pass % 2 )); then
              python3 tools/test_encoder_equivalence.py \
                bin/vqf_encode /tmp/vqf-parent/bin/vqf_encode
            else
              python3 tools/test_encoder_equivalence.py \
                /tmp/vqf-parent/bin/vqf_encode bin/vqf_encode
            fi
          done

      - name: Synthetic voice and fricative diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/benchmark_voice_synthetic.py bin/vqf_encode bin/vqf_decode

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          make test

      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: vqf-linux-x64
          path: |
            bin/vqf_encode
            bin/vqf_decode
          retention-days: 7
