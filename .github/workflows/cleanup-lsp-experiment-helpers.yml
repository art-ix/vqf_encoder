name: cleanup-lsp-experiment-helpers

on:
  push:
    branches: [encoder-quality]
    paths:
      - '.github/workflows/cleanup-lsp-experiment-helpers.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-shot experiment helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Artix"
          git config user.email "60628557+art-ix@users.noreply.github.com"
          git rm -f \
            .github/workflows/lsp-voice-experiment.yml \
            tools/lsp_voice_experiment_patch.py \
            .github/workflows/apply-lsp-conditional-sweep.yml \
            tools/apply_lsp_conditional_sweep.py \
            .github/workflows/cleanup-lsp-experiment-helpers.yml
          git commit -m "Remove one-shot LSP experiment helpers"
          git push origin HEAD:encoder-quality
