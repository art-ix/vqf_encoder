name: apply-avx2-full8-dispatch

on:
  push:
    branches: [encoder-quality]
    paths: [.github/workflows/apply-avx2-full8-dispatch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build baseline
        shell: bash
        run: |
          set -euo pipefail
          make -j2 all
          cp bin/vqf_encode /tmp/vqf-encode-base
      - name: Hoist full-eight dispatch out of candidate loop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('twinvq/src/twinvq_simd.hpp')
          s = p.read_text()
          old = '''    const int entries = count * (signed_code ? 2 : 1);\n    for (int first = 0; first < entries; first += 8) {\n        const int lanes = std::min(8, entries - first);\n        const float* values = packed + (first / 8) * book.stride * 8;\n        const __m256 group_errors = lanes == 8\n            ? avx2_candidate_errors8(target, weight, values, length, best.error)\n            : avx2_candidate_errors(target, weight, values, length, lanes, best.error);\n        const int lane_mask = (1 << lanes) - 1;\n        const int better_mask = _mm256_movemask_ps(_mm256_cmp_ps(\n            group_errors, _mm256_set1_ps(best.error), _CMP_LT_OQ)) & lane_mask;\n        if (!better_mask) continue;\n        float error[8];\n        _mm256_storeu_ps(error, group_errors);\n        for (int lane = 0; lane < lanes; ++lane) {\n            const int entry = first + lane;\n            if (error[lane] < best.error)\n                best = {error[lane], signed_code ? entry / 2 : entry,\n                         signed_code && entry % 2 ? -1 : 1};\n        }\n    }\n'''
          new = '''    const int entries = count * (signed_code ? 2 : 1);\n    if ((entries & 7) == 0) {\n        for (int first = 0; first < entries; first += 8) {\n            const float* values = packed + (first / 8) * book.stride * 8;\n            const __m256 group_errors = avx2_candidate_errors8(\n                target, weight, values, length, best.error);\n            const int better_mask = _mm256_movemask_ps(_mm256_cmp_ps(\n                group_errors, _mm256_set1_ps(best.error), _CMP_LT_OQ));\n            if (!better_mask) continue;\n            float error[8];\n            _mm256_storeu_ps(error, group_errors);\n            for (int lane = 0; lane < 8; ++lane) {\n                const int entry = first + lane;\n                if (error[lane] < best.error)\n                    best = {error[lane], signed_code ? entry / 2 : entry,\n                             signed_code && entry % 2 ? -1 : 1};\n            }\n        }\n        return best;\n    }\n    for (int first = 0; first < entries; first += 8) {\n        const int lanes = std::min(8, entries - first);\n        const float* values = packed + (first / 8) * book.stride * 8;\n        const __m256 group_errors = avx2_candidate_errors(\n            target, weight, values, length, lanes, best.error);\n        const int lane_mask = (1 << lanes) - 1;\n        const int better_mask = _mm256_movemask_ps(_mm256_cmp_ps(\n            group_errors, _mm256_set1_ps(best.error), _CMP_LT_OQ)) & lane_mask;\n        if (!better_mask) continue;\n        float error[8];\n        _mm256_storeu_ps(error, group_errors);\n        for (int lane = 0; lane < lanes; ++lane) {\n            const int entry = first + lane;\n            if (error[lane] < best.error)\n                best = {error[lane], signed_code ? entry / 2 : entry,\n                         signed_code && entry % 2 ? -1 : 1};\n        }\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one candidate loop, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Verify candidate
        shell: bash
        run: |
          set -euo pipefail
          make -j2 all
          ./bin/vqf_encode --test-simd
          ./bin/vqf_encode --test-codec-search
          for pass in 1 2 3 4; do
            echo "=== equivalence timing pass $pass ==="
            if (( pass % 2 )); then
              python3 tools/test_encoder_equivalence.py /tmp/vqf-encode-base bin/vqf_encode
            else
              python3 tools/test_encoder_equivalence.py bin/vqf_encode /tmp/vqf-encode-base
            fi
          done
      - name: Commit tested optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Artix"
          git config user.email "60628557+art-ix@users.noreply.github.com"
          git add twinvq/src/twinvq_simd.hpp
          git commit -m "Hoist full AVX2 candidate dispatch"
          git push origin HEAD:encoder-quality
