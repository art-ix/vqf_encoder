name: lsp-voice-experiment

on:
  push:
    branches: [encoder-quality]
    paths:
      - '.github/workflows/lsp-voice-experiment.yml'
      - 'tools/lsp_voice_experiment_patch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply voice-formant LSP ranking experiment
        run: |
          python3 tools/lsp_voice_experiment_patch.py
          git diff --check
          git diff -- twinvq/src/twinvq_encoder.cpp

      - name: Build
        run: make -j2 all

      - name: Targeted regression
        run: |
          ./bin/vqf_encode --test-mdct
          ./bin/vqf_encode --test-codec-lsp
          python3 tools/test_voice_protection.py bin/vqf_encode
          python3 tools/benchmark_voice_synthetic.py bin/vqf_encode bin/vqf_decode

      - name: Upload experimental Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: vqf-linux-lsp-voice-exp
          path: |
            bin/vqf_encode
            bin/vqf_decode
          retention-days: 3
